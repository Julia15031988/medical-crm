version: "3.9"

services:
  app:
    build: .
    container_name: medical_crm_app

    env_file:
      - .env

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    depends_on:
      - db

    command: >
      sh -c "
      /app/commands/run_migration.sh &&
      /app/commands/run_web_server.sh
      "

  db:
    image: postgres:16-alpine
    container_name: medical_crm_db

    restart: always

    env_file:
      - .env

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
